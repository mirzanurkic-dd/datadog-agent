# Per bundle:
#   resources: Kubernetes resources to generate actions for.
#   redactedResources: resources that embed a pod spec. Their actions redact
#     sensitive values from the returned objects with support.Redact<Resource>
#     when private_action_runner.kubernetes_redact_sensitive_values is enabled.
apps:
  version: v1
  copyrightYear: 2025
  resources:
    - ControllerRevision
    - DaemonSet
    - Deployment
    - ReplicaSet
    - StatefulSet
  redactedResources:
    - ControllerRevision
    - DaemonSet
    - Deployment
    - ReplicaSet
    - StatefulSet
batch:
  version: v1
  copyrightYear: 2025
  resources:
    - CronJob
    - Job
  redactedResources:
    - CronJob
    - Job
core:
  version: v1
  copyrightYear: 2025
  resources:
    - ConfigMap
    - Endpoints
    - Event
    - LimitRange
    - Namespace
    - Node
    - PersistentVolume
    - PersistentVolumeClaim
    - Pod
    - PodTemplate
    - ReplicationController
    - ResourceQuota
    - Service
    - ServiceAccount
  redactedResources:
    - Pod
    - PodTemplate
    - ReplicationController
discovery:
  version: v1
  copyrightYear: 2026
  resources:
    - EndpointSlice
networking:
  version: v1
  copyrightYear: 2025
  resources:
    - Ingress
    - IngressClass
    - IPAddress
    - NetworkPolicy
    - ServiceCIDR
